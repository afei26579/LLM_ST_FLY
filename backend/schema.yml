openapi: 3.0.3
info:
  title: LLM ST FLY API
  version: 1.0.0
  description: 智能管理系统API文档
  contact:
    name: API Support
    email: support@example.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api/v1
    description: 开发环境
  - url: https://api.ylongf.cn/api/v1
    description: 生产环境

paths:
  # 认证相关接口
  /auth/login/:
    post:
      operationId: auth_login
      summary: 用户登录
      description: 用户通过用户名和密码登录系统
      tags:
        - 认证管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login_example:
                summary: 登录示例
                value:
                  username: admin
                  password: password123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 认证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register/:
    post:
      operationId: auth_register
      summary: 用户注册
      description: 新用户注册账户
      tags:
        - 认证管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: 注册失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/token/:
    post:
      operationId: auth_token_obtain
      summary: 获取JWT令牌
      description: 通过用户名和密码获取JWT访问令牌和刷新令牌
      tags:
        - 认证管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainRequest'
      responses:
        '200':
          description: 令牌获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      summary: 刷新JWT令牌
      description: 使用刷新令牌获取新的访问令牌
      tags:
        - 认证管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: 令牌刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'

  /auth/token/verify/:
    post:
      operationId: auth_token_verify
      summary: 验证JWT令牌
      description: 验证JWT令牌是否有效
      tags:
        - 认证管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
      responses:
        '200':
          description: 令牌有效
        '401':
          description: 令牌无效

  # 角色管理接口
  /auth/roles/:
    get:
      operationId: roles_list
      summary: 获取角色列表
      description: 获取系统中所有角色的列表
      tags:
        - 角色管理
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
        - name: search
          in: query
          description: 搜索关键词
          schema:
            type: string
        - name: is_system
          in: query
          description: 是否为系统角色
          schema:
            type: boolean
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 角色列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleList'

    post:
      operationId: roles_create
      summary: 创建角色
      description: 创建新的用户角色（仅管理员）
      tags:
        - 角色管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      security:
        - jwtAuth: []
      responses:
        '201':
          description: 角色创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: 创建失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/roles/{id}/:
    get:
      operationId: roles_retrieve
      summary: 获取角色详情
      description: 获取指定角色的详细信息
      tags:
        - 角色管理
      parameters:
        - name: id
          in: path
          required: true
          description: 角色ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 角色详情获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: roles_update
      summary: 更新角色
      description: 更新指定角色的信息（仅管理员）
      tags:
        - 角色管理
      parameters:
        - name: id
          in: path
          required: true
          description: 角色ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 角色更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: 更新失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      operationId: roles_partial_update
      summary: 部分更新角色
      description: 部分更新指定角色的信息（仅管理员）
      tags:
        - 角色管理
      parameters:
        - name: id
          in: path
          required: true
          description: 角色ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 角色更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'

    delete:
      operationId: roles_destroy
      summary: 删除角色
      description: 删除指定角色（仅管理员，系统角色不可删除）
      tags:
        - 角色管理
      parameters:
        - name: id
          in: path
          required: true
          description: 角色ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '204':
          description: 角色删除成功
        '400':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/roles/{id}/users/:
    get:
      operationId: roles_users_list
      summary: 获取角色下的用户列表
      description: 获取指定角色下的所有用户
      tags:
        - 角色管理
      parameters:
        - name: id
          in: path
          required: true
          description: 角色ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户列表获取成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  # 用户管理接口
  /auth/users/:
    get:
      operationId: users_list
      summary: 获取用户列表
      description: 获取系统中所有用户的列表（仅管理员）
      tags:
        - 用户管理
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
        - name: search
          in: query
          description: 搜索关键词
          schema:
            type: string
        - name: user_role
          in: query
          description: 用户角色ID
          schema:
            type: integer
        - name: is_active
          in: query
          description: 是否激活
          schema:
            type: boolean
        - name: is_staff
          in: query
          description: 是否为员工
          schema:
            type: boolean
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'

    post:
      operationId: users_create
      summary: 创建用户
      description: 创建新用户（仅管理员）
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      security:
        - jwtAuth: []
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/users/{id}/:
    get:
      operationId: users_retrieve
      summary: 获取用户详情
      description: 获取指定用户的详细信息
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户详情获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      operationId: users_update
      summary: 更新用户
      description: 更新指定用户的信息（仅管理员）
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      operationId: users_partial_update
      summary: 部分更新用户
      description: 部分更新指定用户的信息（仅管理员）
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      operationId: users_destroy
      summary: 删除用户
      description: 删除指定用户（仅管理员）
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '204':
          description: 用户删除成功

  /auth/users/me/:
    get:
      operationId: users_me_retrieve
      summary: 获取当前用户信息
      description: 获取当前登录用户的详细信息
      tags:
        - 用户管理
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 当前用户信息获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      operationId: users_me_update
      summary: 更新当前用户信息
      description: 更新当前登录用户的信息
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户信息更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      operationId: users_me_partial_update
      summary: 部分更新当前用户信息
      description: 部分更新当前登录用户的信息
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户信息更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/users/change-password/:
    post:
      operationId: users_change_password
      summary: 修改密码
      description: 当前用户修改自己的密码
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 密码修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/users/{id}/reset-password/:
    post:
      operationId: users_reset_password
      summary: 重置用户密码
      description: 管理员重置指定用户的密码
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  description: 新密码
              required:
                - new_password
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 密码重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/users/{id}/toggle-active/:
    post:
      operationId: users_toggle_active
      summary: 切换用户激活状态
      description: 管理员切换指定用户的激活状态
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户状态切换成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: 操作结果消息
                  is_active:
                    type: boolean
                    description: 当前激活状态

  /auth/user-management/:
    get:
      operationId: user_management_list
      summary: 用户管理列表
      description: 获取用户管理列表（管理员专用）
      tags:
        - 用户管理
      parameters:
        - name: page
          in: query
          description: 页码
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户管理列表获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'

    post:
      operationId: user_management_create
      summary: 创建用户（管理）
      description: 管理员创建新用户
      tags:
        - 用户管理
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      security:
        - jwtAuth: []
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/user-management/{id}/:
    get:
      operationId: user_management_retrieve
      summary: 获取用户详情（管理）
      description: 管理员获取指定用户的详细信息
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户详情获取成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      operationId: user_management_update
      summary: 更新用户（管理）
      description: 管理员更新指定用户的信息
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      operationId: user_management_partial_update
      summary: 部分更新用户（管理）
      description: 管理员部分更新指定用户的信息
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      operationId: user_management_destroy
      summary: 删除用户（管理）
      description: 管理员删除指定用户
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      security:
        - jwtAuth: []
      responses:
        '204':
          description: 用户删除成功

  /auth/user-management/{id}/status/:
    patch:
      operationId: user_management_status_update
      summary: 更新用户状态
      description: 管理员更新指定用户的激活状态
      tags:
        - 用户管理
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active:
                  type: boolean
                  description: 用户激活状态
              required:
                - is_active
      security:
        - jwtAuth: []
      responses:
        '200':
          description: 用户状态更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    # 基础响应模式
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: 错误消息
        code:
          type: integer
          description: 错误代码
        details:
          type: object
          description: 错误详情
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          description: 成功消息
        data:
          type: object
          description: 响应数据

    # 认证相关模式
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          description: 用户名
          minLength: 1
          maxLength: 150
        password:
          type: string
          description: 密码
          writeOnly: true
          minLength: 1
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: object
          properties:
            refresh:
              type: string
              description: 刷新令牌
            access:
              type: string
              description: 访问令牌
          required:
            - refresh
            - access
      required:
        - user
        - token

    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: object
          properties:
            refresh:
              type: string
              description: 刷新令牌
            access:
              type: string
              description: 访问令牌
          required:
            - refresh
            - access
      required:
        - user
        - token

    TokenObtainRequest:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
        - username
        - password

    TokenResponse:
      type: object
      properties:
        access:
          type: string
          description: 访问令牌
        refresh:
          type: string
          description: 刷新令牌
      required:
        - access
        - refresh

    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
        - refresh

    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
          description: 新的访问令牌
      required:
        - access

    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
        - token

    # 角色相关模式
    Role:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: 角色代码
          maxLength: 50
        name:
          type: string
          description: 角色名称
          maxLength: 100
        description:
          type: string
          description: 角色描述
        is_system:
          type: boolean
          description: 是否为系统角色
          readOnly: true
